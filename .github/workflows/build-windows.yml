name: Build Windows Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path bridge/requirements.txt) { pip install -r bridge/requirements.txt }

      - name: Build Python Sidecar with PyInstaller
        run: |
          cd bridge
          pyinstaller --onefile --name wsm-local-bridge wsm_local_bridge.py

      - name: Copy Sidecar to Tauri Binaries Folder
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          Copy-Item -Path bridge/dist/wsm-local-bridge.exe -Destination src-tauri/binaries/wsm-local-bridge-x86_64-pc-windows-msvc.exe

      - name: Install Frontend Dependencies
        working-directory: ./wsm-app
        run: npm install

      - name: Build Frontend
        working-directory: ./wsm-app
        run: npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Build Tauri Application
        working-directory: ./src-tauri
        run: cargo tauri build --target x86_64-pc-windows-msvc

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WP-Store-Manager-Setup
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
