<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F1115">
  <meta name="robots" content="noindex,nofollow">
  <link rel="manifest" href="./manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>میزکار یکپارچه — مدیر فروشگاه</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#0F1115;
      --panel:#1A1D24;
      --panel-2:#22262D;
      --line:#343A42;
      --text:#E8EAED;
      --muted:#9CA3AF;
      --teal:#00E5A1;
      --teal-soft:#00E5A11c;
      font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;
      font-size:16px;
      font-synthesis:none;
      text-rendering:optimizeLegibility;
      -webkit-font-smoothing:antialiased;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text)}
    body{font:400 16px/1.55 Vazirmatn,Tahoma,"Segoe UI",sans-serif}
    button,input{font:inherit;color:inherit}
    button{cursor:pointer;font-weight:600}
    .desktop{height:100dvh;min-height:560px;display:grid;grid-template-rows:68px minmax(0,1fr);background:var(--bg)}
    .topbar{min-width:0;display:flex;align-items:center;gap:16px;padding:0 22px;border-bottom:1px solid var(--line);background:#14171d}
    .brand{min-width:250px;display:flex;align-items:center;gap:12px}
    .brandmark{width:42px;height:42px;display:grid;place-items:center;flex:none;border:1px solid #00E5A14c;border-radius:12px;background:linear-gradient(145deg,#00E5A1,#0fb87c);color:#071711;font-size:13px;font-weight:700;box-shadow:0 8px 22px #00e5a11c}
    .brand-copy{display:grid;gap:1px;min-width:0}
    .brand-copy strong{font-size:18px;font-weight:700;line-height:1.35;white-space:nowrap}
    .brand-copy small{color:var(--muted);font-size:14px;white-space:nowrap}
    .topbar-spacer{flex:1}
    .connection{min-height:40px;display:flex;align-items:center;gap:9px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--muted);font-size:14px;white-space:nowrap}
    .connection i,.status-dot{width:9px;height:9px;display:inline-block;flex:none;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px #00e5a11a}
    .connection.is-offline{color:#FFAA8F;border-color:#ff6b3545}
    .connection.is-offline i{background:#FF6B35;box-shadow:0 0 0 4px #ff6b351a}
    .icon-button{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);transition:border-color .16s,background .16s,transform .16s}
    .icon-button:hover{border-color:var(--teal);background:var(--panel-2)}
    .icon-button:active{transform:scale(.97)}
    .icon-button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .desktop-sidebar-toggle{display:grid;flex:none}
    .mobile-menu-button,.mobile-back-button{display:none}
    body.mobile-shell .desktop-sidebar-toggle{display:none!important}
    .mobile-back-button{width:auto;min-width:44px;gap:7px;padding:0 10px;font-size:14px}
    .mobile-back-button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .drawer-backdrop{display:none}
    .app-frame.is-entering{animation:frame-slide-in .24s cubic-bezier(.2,.8,.2,1) both}
    @keyframes frame-slide-in{from{opacity:.72;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}
    .workspace{position:relative;min-height:0;display:grid;grid-template-columns:292px minmax(0,1fr);direction:rtl}
    @media(min-width:761px){
      .workspace{transition:grid-template-columns .26s cubic-bezier(.2,.8,.2,1)}
      .sidebar{min-width:0;transition:opacity .18s ease,border-color .26s ease}
      body.sidebar-collapsed .workspace{grid-template-columns:0 minmax(0,1fr)}
      body.sidebar-collapsed .sidebar{min-width:0;opacity:0;pointer-events:none;border-width:0}
    }
    .sidebar{min-height:0;display:flex;flex-direction:column;overflow:hidden;border-left:1px solid var(--line);background:#14171d}
    .sidebar-head{flex:none;padding:18px 16px 14px;border-bottom:1px solid #ffffff0b}
    .sidebar-title{margin:0 4px 12px;font-size:16px;font-weight:700}
    .sidebar-hint{margin:-6px 4px 14px;color:var(--muted);font-size:14px;line-height:1.6}
    .search-box{height:46px;display:flex;align-items:center;gap:10px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--muted)}
    .search-box:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px #00e5a114}
    .search-box svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .search-box input{width:100%;min-width:0;min-height:44px;height:44px;padding:0;border:0;outline:0;background:transparent;color:var(--text);font-size:14px}
    .search-box input::placeholder{color:#89929b;font-size:14px}
    .nav-list{min-height:0;flex:1;overflow:auto;padding:10px 12px 20px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#424951 transparent}
    .nav-group{padding:8px 0 12px}
    .nav-group+.nav-group{border-top:1px solid #ffffff0d}
    .nav-group[hidden]{display:none}
    .group-title{display:flex;align-items:center;gap:8px;margin:0 8px 8px;color:#A8B0B8;font-size:14px;font-weight:700}
    .group-title:before{width:7px;height:7px;content:"";border-radius:2px;background:var(--teal);opacity:.82;flex:none}
    .group-title button{width:auto;flex:1;min-height:36px;display:flex;align-items:center;gap:8px;padding:2px 0;border:0;background:transparent;color:inherit;text-align:right;font:inherit}
    .group-chevron{width:16px;height:16px;flex:none;margin-inline-start:auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
    .nav-group.is-collapsed .group-chevron{transform:rotate(-90deg)}
    .nav-items{display:grid;gap:4px}
    .nav-items.is-collapsed{display:none}
    .nav-item{position:relative;width:100%;min-height:50px;display:flex;align-items:center;gap:11px;padding:6px 9px;border:1px solid transparent;border-radius:12px;background:transparent;text-align:right;color:var(--text);transition:background .15s,border-color .15s,transform .15s}
    .nav-item:hover{border-color:#ffffff14;background:#ffffff08}
    .nav-item:active{transform:scale(.99)}
    .nav-item:focus-visible,.icon-button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
    .nav-item[hidden]{display:none!important}
    .nav-item.is-active{border-color:#00e5a145;background:#00e5a114}
    .nav-item.is-active .nav-icon,.nav-item.is-open .nav-icon{border-color:#00e5a13d;background:#00e5a11b;color:var(--teal)}
    .nav-item.is-open .nav-state{opacity:1}
    .nav-icon{width:38px;height:38px;display:grid;place-items:center;flex:none;border:1px solid #ffffff08;border-radius:11px;background:#22262d;color:#B6C0C8}
    .nav-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
    .nav-copy{min-width:0;flex:1;display:grid;gap:0}
    .nav-label{overflow:hidden;font-size:15px;font-weight:600;line-height:1.5;text-overflow:ellipsis;white-space:nowrap}
    .nav-description{overflow:hidden;color:var(--muted);font-size:14px;line-height:1.45;text-overflow:ellipsis;white-space:nowrap}
    .nav-state{width:8px;height:8px;flex:none;border-radius:50%;background:var(--teal);opacity:0;box-shadow:0 0 0 4px #00e5a114}
    .main-panel{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding:16px 18px 12px;background:var(--bg)}
    .main-head{min-width:0;min-height:64px;display:flex;align-items:center;gap:16px;padding:0 4px}
    .main-heading{min-width:0;flex:1}
    .main-eyebrow{margin:0 0 2px;color:var(--teal);font-size:13px;font-weight:600}
    /* Keep this shell heading as the single primary title; iframe content omits duplicate H1s. */
    .main-heading h1{margin:0;overflow:hidden;font-size:26px;font-weight:700;line-height:1.35;text-overflow:ellipsis;white-space:nowrap}
    .main-heading p{margin:3px 0 0;color:var(--muted);font-size:14px}
    .head-actions{display:flex;align-items:center;gap:8px}
    .page-state{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;white-space:nowrap}
    .frame-shell{position:relative;min-width:0;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:0 18px 44px #0003}
    .app-frame{width:100%;height:100%;display:block;border:0;background:var(--bg)}
    .frame-loading{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:#0F1115;color:var(--muted);font-size:16px;transition:opacity .18s}
    .frame-loading[hidden]{display:none}
    .loader{width:28px;height:28px;margin:0 auto 10px;border:3px solid #ffffff1a;border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .statusbar{width:100%;min-width:0;box-sizing:border-box;min-height:32px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px;color:var(--muted);font-size:14px;direction:ltr}
    .statusbar-main{display:flex;align-items:center;gap:9px;min-width:0;min-height:30px;flex:1;direction:rtl}
    .statusbar-main #status-message{display:block;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .statusbar-main #wsm-smart-cache-status{flex:0 1 auto;min-width:0;max-width:min(300px,38vw)}
    .statusbar-main #wsm-smart-cache-state{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .statusbar .wsm-sync-status{position:static;inset:auto;bottom:auto;left:auto;right:auto;z-index:auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;margin:0 auto 0 0;min-width:0;max-width:min(360px,48vw);min-height:29px;box-sizing:border-box;padding:4px 8px;border:1px solid #25c47b55;border-radius:10px;background:#10251e;color:#69e3a6;direction:rtl;white-space:nowrap;font:700 11px/1.2 Tahoma,Arial,sans-serif;cursor:pointer;appearance:none;-webkit-appearance:none}
    .statusbar .wsm-sync-status.is-offline{border-color:#f59e0b77;background:#2b2113;color:#ffbf69}
    .statusbar .wsm-sync-status.has-failures{border-color:#fb7185aa;background:#351b20;color:#ff8b9b}
    .statusbar .wsm-sync-icon{width:15px;height:15px;display:grid;place-items:center;flex:none}
    .statusbar .wsm-sync-icon svg{display:block;width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .statusbar .wsm-sync-icon-offline{display:none}
    .statusbar .wsm-sync-status.is-offline .wsm-sync-icon-online{display:none}
    .statusbar .wsm-sync-status.is-offline .wsm-sync-icon-offline{display:grid}
    .statusbar .wsm-sync-spinner{display:none;width:13px;height:13px;flex:none;border:2px solid currentColor;border-left-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
    .statusbar .wsm-sync-status.is-syncing .wsm-sync-spinner{display:inline-block}
    .statusbar .wsm-sync-status.is-syncing .wsm-sync-icon{display:none}
    .statusbar .wsm-sync-label{max-width:116px;overflow:hidden;text-overflow:ellipsis}
    .statusbar .wsm-last-sync{max-width:140px;overflow:hidden;text-overflow:ellipsis;border-inline-start:1px solid currentColor;padding-inline-start:6px;opacity:.8;font-size:10px;font-weight:600}
    .statusbar .wsm-sync-pending{display:inline-flex;align-items:center;gap:3px;margin-inline-start:2px;padding:2px 5px;border:1px solid #f0b42955;border-radius:999px;background:#3a2b10;color:#ffd778;font-size:9px;font-weight:800}
    .statusbar .wsm-sync-pending[hidden]{display:none!important}
    .statusbar-note{white-space:nowrap}
    .toast{position:fixed;z-index:20;inset-inline-start:22px;bottom:22px;max-width:min(520px,calc(100vw - 44px));padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:#22262d;color:var(--text);font-size:14px;box-shadow:0 15px 40px #0008;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .18s,transform .18s}
    .toast.show{opacity:1;transform:none}
    .toast.is-error{border-color:#8e3c3f;color:#ffb6b6}
    @media(max-width:1180px){.workspace{grid-template-columns:264px minmax(0,1fr)}.brand{min-width:220px}.sidebar-hint{font-size:14px}}
    @media(max-width:900px){.desktop{grid-template-rows:60px minmax(0,1fr)}.topbar{padding:0 14px}.workspace{grid-template-columns:240px minmax(0,1fr)}.main-panel{padding:12px}.page-state,.statusbar-note{display:none}}
    @media(max-width:760px){
      html,body{height:100%;overflow:hidden}
      .desktop{height:100dvh;min-height:0;grid-template-rows:calc(58px + env(safe-area-inset-top)) minmax(0,1fr)}
      .topbar{height:calc(58px + env(safe-area-inset-top));gap:9px;padding:env(safe-area-inset-top) 10px 0}
      .desktop-sidebar-toggle{display:none}
      .mobile-menu-button{display:grid;width:42px;height:42px;flex:none}
      .brand{min-width:0;flex:1;gap:8px}
      .brandmark{width:36px;height:36px;font-size:11px}
      .brand-copy strong{font-size:16px}
      .brand-copy small{display:none}
      .connection{min-height:38px;gap:7px;padding:0 8px;font-size:13px}
      .connection i{width:8px;height:8px}
      .topbar .icon-button#reload-current{width:40px;height:40px}
      .workspace{min-height:0;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);overflow:hidden}
      .sidebar{position:fixed;z-index:32;inset-block:0;inset-inline-start:0;width:min(360px,88vw);height:100dvh;max-height:none;transform:translateX(106%);transition:transform .24s cubic-bezier(.2,.8,.2,1);border:0;border-inline-end:1px solid var(--line);box-shadow:0 20px 64px #000a}
      .sidebar.is-open{transform:translateX(0)}
      .drawer-backdrop{position:fixed;z-index:31;inset:0;display:block;border:0;background:#0009;opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s}
      .drawer-backdrop.is-open{opacity:1;visibility:visible}
      .sidebar-head{padding:16px 14px 12px}
      .sidebar-title{font-size:16px}
      .sidebar-hint{display:block;font-size:14px;margin-bottom:12px}
      .nav-list{display:block;overflow:auto;padding:8px 12px 24px;overscroll-behavior:contain}
      .nav-group{min-width:0;padding:8px 0 12px}
      .nav-group+.nav-group{padding-inline-start:0;border-top:1px solid #ffffff0d;border-inline-start:0}
      .group-title{margin:0 8px 8px;font-size:14px}
      .nav-items{display:grid;gap:4px}
      .nav-item{width:100%;min-width:0;min-height:50px;padding:6px 9px}
      .nav-icon{width:38px;height:38px}
      .nav-icon svg{width:20px;height:20px}
      .nav-label{font-size:15px}
      .nav-description{display:block;font-size:14px}
      .nav-state{display:block}
      .main-panel{min-height:0;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
      .main-head{min-height:58px;gap:8px;padding:0 2px}
      .mobile-back-button{display:flex;min-height:42px}
      .main-eyebrow{font-size:12px}
      .main-heading h1{font-size:20px}
      .main-heading p{font-size:14px}
      .page-state,.statusbar-note{display:none}
      .frame-shell{min-height:0;border-radius:12px}
      .statusbar{min-height:30px;flex-wrap:wrap;align-items:center;row-gap:2px;gap:4px;font-size:12px;padding:3px 4px}
      .statusbar-main{order:2;flex:1 1 100%;min-height:28px;gap:7px}
      .statusbar-main #wsm-smart-cache-status{max-width:min(300px,38vw)}
      .statusbar-main #wsm-smart-cache-state{max-width:140px}
      .statusbar .wsm-sync-status{max-width:47vw;min-height:27px;gap:4px;padding:3px 6px;font-size:9px}
      .statusbar .wsm-sync-label{max-width:68px}
      .statusbar .wsm-last-sync{max-width:86px;padding-inline-start:4px;font-size:8px}
      .toast{inset-inline-start:10px;bottom:12px;max-width:calc(100vw - 20px)}
    }
    @media(max-width:390px){.connection{font-size:12px;padding:0 6px}.brand-copy strong{font-size:15px}.main-panel{padding:8px}.mobile-back-button{padding:0 7px}.statusbar{gap:4px;padding:0 2px}.statusbar .wsm-sync-status{max-width:52vw;padding:3px 5px}.statusbar .wsm-last-sync{max-width:62px;font-size:7px}.statusbar .wsm-sync-label{max-width:56px}}
    /* Hide WSM shell chrome only while the POS route is active. Keep the back control available. */
    .desktop.is-pos-view{grid-template-rows:minmax(0,1fr)!important}
    .desktop.is-pos-view .topbar,.desktop.is-pos-view .sidebar,.desktop.is-pos-view .drawer-backdrop,.desktop.is-pos-view .mobile-menu-button,.desktop.is-pos-view .statusbar{display:none!important}
    .desktop.is-pos-view .workspace{width:100%!important;max-width:100%!important;margin:0!important;grid-template-columns:minmax(0,1fr)!important;grid-template-rows:minmax(0,1fr)!important}
    .desktop.is-pos-view .main-panel{width:100%!important;max-width:100%!important;min-width:0!important;min-height:0!important;margin:0!important;padding:0!important;gap:0!important;grid-template-rows:auto minmax(0,1fr)!important}
    .desktop.is-pos-view .main-head{min-height:0!important;padding:0!important;border:0!important}
    .desktop.is-pos-view .main-heading,.desktop.is-pos-view .head-actions{display:none!important}
    .desktop.is-pos-view .mobile-back-button{display:flex!important}
    .desktop.is-pos-view .frame-shell{width:100%!important;max-width:100%!important;min-width:0!important;min-height:0!important;height:100%!important;border:0!important;border-radius:0!important;box-shadow:none!important}
    .desktop.is-pos-view #app-frame{display:block!important;width:100%!important;max-width:100%!important;height:100%!important;border:0!important}
    
    /* Attendance shares the focused, sidebar-free shell used by the POS. */
    .desktop.is-attendance-view{grid-template-rows:minmax(0,1fr)!important}
    .desktop.is-attendance-view .topbar,.desktop.is-attendance-view .sidebar,.desktop.is-attendance-view .drawer-backdrop,.desktop.is-attendance-view .mobile-menu-button,.desktop.is-attendance-view .statusbar{display:none!important}
    .desktop.is-attendance-view .workspace{width:100%!important;max-width:100%!important;margin:0!important;grid-template-columns:minmax(0,1fr)!important;grid-template-rows:minmax(0,1fr)!important}
    .desktop.is-attendance-view .main-panel{width:100%!important;max-width:100%!important;min-width:0!important;min-height:0!important;margin:0!important;padding:0!important;gap:0!important;grid-template-rows:auto minmax(0,1fr)!important}
    .desktop.is-attendance-view .main-head{min-height:0!important;padding:0!important;border:0!important}
    .desktop.is-attendance-view .main-heading,.desktop.is-attendance-view .head-actions{display:none!important}
    .desktop.is-attendance-view .mobile-back-button{display:flex!important}
    .desktop.is-attendance-view .frame-shell{width:100%!important;max-width:100%!important;min-width:0!important;min-height:0!important;height:100%!important;border:0!important;border-radius:0!important;box-shadow:none!important}
    .desktop.is-attendance-view #app-frame{display:block!important;width:100%!important;max-width:100%!important;height:100%!important;border:0!important}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <script>
    (()=>{const isMobile=window.matchMedia('(max-width: 760px)').matches||/(Android|iPhone|iPad|iPod|Mobile|IEMobile|Opera Mini)/i.test(navigator.userAgent);if(isMobile){document.body.classList.add('mobile-shell');return}try{if(window.localStorage.getItem('wsm.desktop.sidebarCollapsed')==='1')document.body.classList.add('sidebar-collapsed')}catch(error){}})();
  </script>
  <div class="desktop">
    <header class="topbar">
      <button class="icon-button desktop-sidebar-toggle" id="desktop-sidebar-toggle" type="button" title="بستن نوار کناری" aria-label="بستن نوار کناری" aria-expanded="true" aria-controls="sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <button class="icon-button mobile-menu-button" id="mobile-menu" type="button" aria-label="باز کردن فهرست" aria-expanded="false" aria-controls="sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="brand" aria-label="میزکار مدیر فروشگاه">
        <span class="brandmark">WSM</span>
        <span class="brand-copy"><strong>میزکار یکپارچه</strong><small>فروشگاه ووکامرس و باشگاه</small></span>
      </div>

function animateFrame(){if(!mobileShell)return;frame.classList.remove('is-entering');void frame.offsetWidth;frame.classList.add('is-entering');setTimeout(()=>frame.classList.remove('is-entering'),280)}
function navigate(id,force=false,fromBack=false){const item=allItems.find(candidate=>candidate.id===id);if(!item||item.window&&!mobileShell||!desktopItemAllowed(item))return;if(mobileShell&&!fromBack&&currentId&&currentId!==id){mobileStack.push(currentId);if(mobileStack.length>25)mobileStack.shift()}currentId=id;syncPosShellView();updateHeader(item);renderMenu();frame.title=item.label;const next=buildUrl(item.route,false);let sameDocument=false,sameHash=false,targetUrl;try{targetUrl=new URL(next,location.href);const currentUrl=new URL(frame.contentWindow.location.href);sameDocument=frame.dataset.loaded==='true'&&currentUrl.origin===targetUrl.origin&&currentUrl.pathname===targetUrl.pathname&&currentUrl.search===targetUrl.search;sameHash=sameDocument&&currentUrl.hash===targetUrl.hash}catch(error){}if(!force&&sameHash){frame.dataset.route=id;frameLoading.hidden=true;closeDrawer();return}frame.dataset.route=id;if(!force&&sameDocument){frameLoading.hidden=true;try{frame.contentWindow.location.hash=targetUrl.hash}catch(error){frame.src=next}animateFrame();closeDrawer();return}frameLoading.hidden=false;frame.src=next;closeDrawer()}
function popupFeatures(){const availableWidth=screen.availWidth||1440,availableHeight=screen.availHeight||900;const width=Math.min(1600,Math.max(Math.min(1000,availableWidth),Math.floor(availableWidth*.84)));const height=Math.min(1100,Math.max(Math.min(650,availableHeight),Math.floor(availableHeight*.86)));const left=Math.max(0,Math.floor((availableWidth-width)/2));const top=Math.max(0,Math.floor((availableHeight-height)/2));return `popup=yes,width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes,status=no,toolbar=no,menubar=no`}
function openNativeWindow(id){const item=allItems.find(candidate=>candidate.id===id&&candidate.window);if(!item||!desktopItemAllowed(item))return;if(mobileShell){navigate(id);showToast(item.label+' در همین صفحه باز شد.');return}let popup=popupWindows.get(id);if(popup&&!popup.closed){try{popup.focus()}catch(error){};renderMenu();showToast(item.label+' فعال شد.');return}popup=window.open(buildUrl(item.route,true),item.windowName,popupFeatures());if(!popup){showToast('باز شدن پنجره مسدود شد؛ اجازهٔ بازشدن پنجره‌های جداگانه را در مرورگر فعال کنید.',true);return}popupWindows.set(id,popup);try{popup.focus()}catch(error){};renderMenu();showToast(item.label+' در پنجرهٔ مستقل باز شد.')}
window.WSMDesktopOpenWindow=openNativeWindow;window.WSMDesktopNavigate=clubView=>{const item=allItems.find(candidate=>candidate.clubView===clubView&&(!candidate.window||mobileShell));if(item)navigate(item.id)};
function syncPopupButtons(){for(const item of allItems){if(!item.window)continue;const button=appsNode.querySelector(`[data-app-id="${item.id}"]`);if(!button)continue;const open=isWindowOpen(item.id);button.classList.toggle('is-open',open);button.setAttribute('aria-pressed',String(open));if(popupWindows.has(item.id)&&!open)popupWindows.delete(item.id)}}
function syncPageFromFrame(){try{const hash=frame.contentWindow.location.hash||'#/';let matched=null;if(hash.startsWith('#/club')){const query=new URLSearchParams(hash.split('?')[1]||''),view=query.get('club')||'overview';matched=allItems.find(item=>item.clubView===view)||null}else{const path=hash.replace(/^#\/?/,'').split(/[/?]/)[0]||'';matched=allItems.find(item=>!item.window&&(item.route==='/'?path==='':item.route.replace(/^\//,'').split('?')[0]===path))||null}if(matched&&(!matched.window||mobileShell)){if(mobileShell&&currentId&&currentId!==matched.id)mobileStack.push(currentId);currentId=matched.id;syncPosShellView();frame.dataset.route=matched.id;updateHeader(matched);renderMenu()}}catch(error){}}
frame.addEventListener('load',()=>{frame.dataset.loaded='true';frameLoading.hidden=true;syncPageFromFrame();animateFrame();try{frame.contentWindow.addEventListener('hashchange',syncPageFromFrame)}catch(error){}});
frame.addEventListener('error',()=>{frameLoading.hidden=true;showToast('بارگذاری بخش انجام نشد.',true)});
appsNode.addEventListener('click',event=>{const groupButton=event.target.closest('[data-group-toggle]');if(groupButton){const index=Number(groupButton.dataset.groupToggle);if(collapsedGroups.has(index))collapsedGroups.delete(index);else collapsedGroups.add(index);renderMenu();return}const button=event.target.closest('[data-app-id]');if(!button)return;const id=button.dataset.appId,item=allItems.find(candidate=>candidate.id===id);if(item?.window)openNativeWindow(id);else navigate(id)});
window.addEventListener('message',event=>{if(event.origin!==location.origin)return;const data=event.data||{};if(data.type==='WSM_APP_PERMISSIONS'){appPermissionState={authenticated:!!data.authenticated,loaded:!!data.loaded,isAdmin:!!data.is_super_admin,permissions:new Set(Array.isArray(data.permissions)?data.permissions:[])};renderMenu();const active=allItems.find(item=>item.id===currentId);if(appPermissionState.authenticated&&appPermissionState.loaded&&active&&!desktopItemAllowed(active)){navigate('my-profile',true)}return}if(data.type==='WSM_DESKTOP_OPEN_WINDOW'&&['pos','attendance'].includes(data.id)){openNativeWindow(data.id);return}if(data.type==='WSM_DESKTOP_NAVIGATE'){const item=allItems.find(candidate=>candidate.clubView===data.id&&(!candidate.window||mobileShell));if(item&&desktopItemAllowed(item))navigate(item.id)}});
searchNode.addEventListener('input',renderMenu);
searchNode.addEventListener('keydown',event=>{if(event.key==='Escape'){searchNode.value='';renderMenu();closeDrawer();return}if(event.key==='Enter'){const button=appsNode.querySelector('.nav-item:not([hidden])');if(button){const item=allItems.find(candidate=>candidate.id===button.dataset.appId);if(item?.window)openNativeWindow(item.id);else navigate(item.id)}}});
mobileMenuNode.addEventListener('click',()=>sidebarNode.classList.contains('is-open')?closeDrawer():openDrawer());
backdropNode.addEventListener('click',closeDrawer);
mobileBackNode.addEventListener('click',()=>{if(mobileStack.length){navigate(mobileStack.pop(),false,true);return}if(currentId&&currentId!=='site-dashboard'){navigate('site-dashboard',false,true);return}openDrawer()});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&sidebarNode.classList.contains('is-open')){closeDrawer();return}if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(mobileShell&&currentId!=='pos'){openDrawer();searchNode.focus()}}});
$('#reload-current').addEventListener('click',()=>{if(!frame.contentWindow)return;try{frame.contentWindow.location.reload()}catch(error){frame.src=buildUrl(allItems.find(item=>item.id===currentId)?.route||'/',false)}});
statusMessageNode.textContent=mobileShell?'همهٔ بخش‌ها، از جمله POS و ورود/خروج، در همین صفحه باز می‌شوند.':'POS و ورود/خروج در دسکتاپ پنجرهٔ مستقل باز می‌شوند.';
const network=$('#network-status');function updateNetwork(){const online=navigator.onLine;network.classList.toggle('is-offline',!online);network.querySelector('span').textContent=online?'آنلاین':'آفلاین';network.title=online?'اتصال شبکه در دسترس است':'اتصال شبکه قطع است'}window.addEventListener('online',updateNetwork);window.addEventListener('offline',updateNetwork);network.addEventListener('click',()=>showToast(navigator.onLine?'اتصال برقرار است.':'اتصال شبکه در دسترس نیست.',!navigator.onLine));updateNetwork();
if(!mobileShell)setInterval(syncPopupButtons,1000);
renderMenu();
const requested=(new URLSearchParams(location.search).get('open')||'').trim();
const requestedMatch=allItems.find(item=>item.id===requested)||allItems.find(item=>item.route.replace(/^\//,'')===requested.replace(/^\//,''));
if(requested==='club'){navigate('club-dashboard')}else if(requestedMatch?.window){currentId='site-dashboard';navigate('site-dashboard');setTimeout(()=>openNativeWindow(requestedMatch.id),900)}else if(requestedMatch){navigate(requestedMatch.id)}else if(requested.startsWith('club?club=')){const view=new URLSearchParams(requested.split('?')[1]||'').get('club');const item=allItems.find(candidate=>candidate.clubView===view);if(item?.window){navigate('site-dashboard');setTimeout(()=>openNativeWindow(item.id),900)}else if(item)navigate(item.id);else navigate('site-dashboard')}else if(requested){const normalized=requested.startsWith('/')?requested:'/'+requested;const item=allItems.find(candidate=>!candidate.window&&candidate.route===normalized);navigate(item?.id||'site-dashboard')}else navigate('site-dashboard');
})();
</script>
</body>
